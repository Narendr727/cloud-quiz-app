<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard | Galgotias LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .nav-bar { background-color: #ffffff; border-bottom: 2px solid #b82332; padding: 14px 25px; }
        .btn-gu { background-color: #b82332; color: white; border: none; }
        .btn-gu:hover { background-color: #961b28; color: white; }
        .course-card {
          background: #ffffff;
          border-radius: 12px;
          border: 1px solid #e1e5eb;
          cursor: pointer;
          overflow: hidden;
          transition: transform 0.2s, box-shadow 0.2s;
        }
        .course-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 8px 20px rgba(0,0,0,0.08);
          border-color: #b82332;
        }
        .card-banner { height: 110px; background: linear-gradient(135deg, #008080, #20b2aa); }
        .section-box { background: white; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="nav-bar d-flex justify-content-between align-items-center shadow-sm">
    <h4 class="m-0 fw-bold text-dark">Faculty Portal</h4>
    <div class="d-flex align-items-center gap-3">
        <span class="fw-bold" style="color: #b82332;" id="facultyNameDisplay">Faculty: Loading...</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container my-4">

    <div id="coursesView">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold m-0 text-dark">My Courses</h4>
                <small class="text-muted">Course Overview</small>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-gu btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addCourseModal">+ Add Course</button>
                <button class="btn btn-outline-danger btn-sm fw-bold" onclick="openRemoveCourseModal()">Remove Course</button>
            </div>
        </div>
        <div class="row g-4" id="coursesContainer"></div>
    </div>

    <div id="courseDetailView" style="display: none;">
        <button class="btn btn-secondary btn-sm mb-3" onclick="showCoursesView()">← Back to Courses</button>
        <h3 id="courseDetailTitle" class="fw-bold text-dark mb-3">Course Title</h3>

        <div class="d-flex gap-2 mb-4">
            <button class="btn btn-gu btn-sm fw-bold" onclick="showSectionsTab()">Sections</button>
            <button class="btn btn-success btn-sm fw-bold" onclick="showLeaderboard()">View Marks & Leaderboard</button>
        </div>

        <div id="sectionsTab">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold text-secondary m-0">Sections</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-gu btn-sm fw-bold" onclick="openAddSectionModal()">+ Add Section</button>
                    <button class="btn btn-outline-danger btn-sm fw-bold" onclick="openRemoveSectionModal()">Remove Section</button>
                </div>
            </div>
            <div id="sectionsContainer"></div>
        </div>

        <div id="leaderboardTab" style="display: none;">
            <h5 class="fw-bold text-success mb-3">Student Performance & Marks</h5>
            <div class="table-responsive bg-white rounded shadow-sm p-3">
                <table class="table table-bordered m-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Student Name</th>
                        <th>Section</th>
                        <th>Correct Questions</th>
                        <th>Final Score</th>
                    </tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="quizBuilderView" style="display: none;">
        <button class="btn btn-secondary btn-sm mb-3" onclick="showCourseDetailView()">← Back to Sections</button>
        <div class="card p-4 shadow-sm border-0">
            <h4 id="quizSectionTitle" class="fw-bold mb-3" style="color: #b82332;">Set Quiz Questions & Timing</h4>
            <form id="quizForm">
                <div class="row g-3 mb-4 bg-light p-3 rounded border">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Topic Name</label>
                        <input type="text" id="topic" class="form-control" placeholder="e.g. Memory Management" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Duration (Mins)</label>
                        <input type="number" id="timeMins" class="form-control" value="10" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Start Date & Time</label>
                        <input type="datetime-local" id="startTime" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">End Date & Time</label>
                        <input type="datetime-local" id="endTime" class="form-control" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="text-secondary m-0">Questions List</h5>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-success btn-sm fw-bold" onclick="addQuestionBlock()">+ Add Question</button>
                        <button type="button" class="btn btn-outline-danger btn-sm fw-bold" onclick="removeQuestionBlock()">- Remove Question</button>
                    </div>
                </div>

                <div id="questionsContainer"></div>
                <button type="submit" class="btn btn-gu fw-bold w-100 py-2 mt-3">Upload & Save Quiz</button>
            </form>
        </div>
    </div>

</div>

<div class="modal fade" id="addSectionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3 fw-bold">Add Section</h5>
            <input type="text" id="sectionNumInput" class="form-control mb-3" placeholder="e.g. 10" required>
            <button type="button" class="btn btn-gu fw-bold" onclick="saveNewSection()">Save Section</button>
        </div>
    </div>
</div>

<div class="modal fade" id="removeSectionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3 fw-bold">Remove Section</h5>
            <select id="removeSectionSelect" class="form-select mb-3"></select>
            <button type="button" class="btn btn-danger fw-bold" onclick="confirmRemoveSection()">Remove Section</button>
        </div>
    </div>
</div>

<div class="modal fade" id="addCourseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3 fw-bold">Add New Course</h5>
            <input type="text" id="newCourseName" class="form-control mb-2" placeholder="Course Title (e.g. Operating System)" required>
            <input type="text" id="newCourseCode" class="form-control mb-3" placeholder="Course Code (e.g. R1UC403B)" required>
            <button type="button" class="btn btn-gu fw-bold" onclick="saveNewCourse()">Create Course</button>
        </div>
    </div>
</div>

<div class="modal fade" id="removeCourseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <h5 class="mb-3 fw-bold">Remove Course</h5>
            <select id="removeCourseSelect" class="form-select mb-3"></select>
            <button type="button" class="btn btn-danger fw-bold" onclick="confirmRemoveCourse()">Delete Course</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem('lms_user')) || { name: 'Faculty Member', role: 'faculty' };
    document.getElementById('facultyNameDisplay').innerText = `Faculty: ${user.name}`;

    let currentCourseId = null;
    let currentSectionId = null;
    let qCount = 0;

    const defaultCourses = [
      { id: '1', title: 'Operating System (R1UC403B)', sections: [] },
      { id: '2', title: 'Data Communication and Networking (R1UC406B)', sections: [] },
      { id: '3', title: 'Design and Analysis of Algorithms (R1UC407B)', sections: [] }
    ];

    function getCourses() {
      const stored = localStorage.getItem('lms_courses');
      if (!stored) {
        localStorage.setItem('lms_courses', JSON.stringify(defaultCourses));
        return defaultCourses;
      }
      return JSON.parse(stored);
    }

    function saveCourses(courses) {
      localStorage.setItem('lms_courses', JSON.stringify(courses));
    }

    function renderCourses() {
      const courses = getCourses();
      const container = document.getElementById('coursesContainer');
      container.innerHTML = '';
      courses.forEach(c => {
        container.innerHTML += `
          <div class="col-md-4">
            <div class="course-card" onclick="openCourse('${c.id}')">
              <div class="card-banner p-3 text-white d-flex align-items-end">
                <span class="badge bg-light text-dark fw-bold">${c.title.split(' ')[0]}</span>
              </div>
              <div class="p-3">
                <h6 class="fw-bold m-0" style="color: #b82332;">${c.title}</h6>
                <small class="text-muted d-block mt-2">${c.sections ? c.sections.length : 0} Sections Active</small>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openCourse(courseId) {
      currentCourseId = courseId;
      const courses = getCourses();
      const course = courses.find(c => c.id === courseId);
      document.getElementById('courseDetailTitle').innerText = course.title;
      showSectionsTab();
      showCourseDetailView();
    }

    function renderSections() {
      const courses = getCourses();
      const course = courses.find(c => c.id === currentCourseId);
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';

      if (!course.sections || course.sections.length === 0) {
        container.innerHTML = '<div class="alert alert-warning">No sections added yet.</div>';
        return;
      }

      course.sections.forEach(s => {
        container.innerHTML += `
          <div class="section-box d-flex justify-content-between align-items-center">
            <div>
              <h6 class="m-0 fw-bold text-dark">${s.name}</h6>
              <small class="text-muted">${s.quiz ? 'Quiz Set: ' + s.quiz.topic : 'No Quiz Active'}</small>
            </div>
            <button class="btn btn-sm btn-outline-danger fw-bold" onclick="setupQuiz('${s.id}')">Set Quiz Questions</button>
          </div>
        `;
      });
    }

    function openAddSectionModal() {
      new bootstrap.Modal(document.getElementById('addSectionModal')).show();
    }

    function saveNewSection() {
      const num = document.getElementById('sectionNumInput').value;
      if (!num) return;

      const courses = getCourses();
      const course = courses.find(c => c.id === currentCourseId);

      const newSec = {
        id: 'sec_' + Date.now(),
        name: `Section ${num} (${user.name})`,
        quiz: null
      };

      if (!course.sections) course.sections = [];
      course.sections.push(newSec);
      saveCourses(courses);

      bootstrap.Modal.getInstance(document.getElementById('addSectionModal')).hide();
      document.getElementById('sectionNumInput').value = '';
      renderSections();
    }

    function openRemoveSectionModal() {
      const courses = getCourses();
      const course = courses.find(c => c.id === currentCourseId);
      const select = document.getElementById('removeSectionSelect');
      select.innerHTML = '';
      (course.sections || []).forEach(s => select.innerHTML += `<option value="${s.id}">${s.name}</option>`);
      new bootstrap.Modal(document.getElementById('removeSectionModal')).show();
    }

    function confirmRemoveSection() {
      const id = document.getElementById('removeSectionSelect').value;
      const courses = getCourses();
      const course = courses.find(c => c.id === currentCourseId);
      course.sections = course.sections.filter(s => s.id !== id);
      saveCourses(courses);
      bootstrap.Modal.getInstance(document.getElementById('removeSectionModal')).hide();
      renderSections();
    }

    function saveNewCourse() {
      const name = document.getElementById('newCourseName').value;
      const code = document.getElementById('newCourseCode').value;
      if (!name || !code) return;

      const courses = getCourses();
      courses.push({ id: Date.now().toString(), title: `${name} (${code})`, sections: [] });
      saveCourses(courses);

      bootstrap.Modal.getInstance(document.getElementById('addCourseModal')).hide();
      document.getElementById('newCourseName').value = '';
      document.getElementById('newCourseCode').value = '';
      renderCourses();
    }

    function openRemoveCourseModal() {
      const courses = getCourses();
      const select = document.getElementById('removeCourseSelect');
      select.innerHTML = '';
      courses.forEach(c => select.innerHTML += `<option value="${c.id}">${c.title}</option>`);
      new bootstrap.Modal(document.getElementById('removeCourseModal')).show();
    }

    function confirmRemoveCourse() {
      const id = document.getElementById('removeCourseSelect').value;
      let courses = getCourses();
      courses = courses.filter(c => c.id !== id);
      saveCourses(courses);
      bootstrap.Modal.getInstance(document.getElementById('removeCourseModal')).hide();
      renderCourses();
    }

    function setupQuiz(secId) {
      currentSectionId = secId;
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      qCount = 0;

      for(let i = 0; i < 5; i++) {
        addQuestionBlock();
      }

      document.getElementById('coursesView').style.display = 'none';
      document.getElementById('courseDetailView').style.display = 'none';
      document.getElementById('quizBuilderView').style.display = 'block';
    }

    function addQuestionBlock() {
      qCount++;
      const container = document.getElementById('questionsContainer');
      const div = document.createElement('div');
      div.className = 'border p-3 mb-3 rounded bg-light q-block';
      div.id = `q_block_${qCount}`;
      div.innerHTML = `
        <label class="fw-bold text-dark mb-2">Question ${qCount}</label>
        <input type="text" class="form-control mb-2 qText" placeholder="Enter Question text" required>
        <div class="row g-2 mb-2">
          <div class="col-6"><input type="text" class="form-control opA" placeholder="Option A" required></div>
          <div class="col-6"><input type="text" class="form-control opB" placeholder="Option B" required></div>
          <div class="col-6"><input type="text" class="form-control opC" placeholder="Option C" required></div>
          <div class="col-6"><input type="text" class="form-control opD" placeholder="Option D" required></div>
        </div>
        <select class="form-select correctOp">
          <option value="A">Correct: Option A</option>
          <option value="B">Correct: Option B</option>
          <option value="C">Correct: Option C</option>
          <option value="D">Correct: Option D</option>
        </select>
      `;
      container.appendChild(div);
    }

    function removeQuestionBlock() {
      if (qCount <= 1) return alert("At least 1 question is required.");
      const lastBlock = document.getElementById(`q_block_${qCount}`);
      if (lastBlock) {
        lastBlock.remove();
        qCount--;
      }
    }

    document.getElementById('quizForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const topic = document.getElementById('topic').value;
      const duration = document.getElementById('timeMins').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;

      const qBlocks = document.querySelectorAll('.q-block');
      const questions = [];

      qBlocks.forEach(b => {
        questions.push({
          q: b.querySelector('.qText').value,
          a: b.querySelector('.opA').value,
          b: b.querySelector('.opB').value,
          c: b.querySelector('.opC').value,
          d: b.querySelector('.opD').value,
          ans: b.querySelector('.correctOp').value
        });
      });

      const courses = getCourses();
      const course = courses.find(c => c.id === currentCourseId);
      const section = course.sections.find(s => s.id === currentSectionId);

      section.quiz = { topic, duration, startTime, endTime, questions };
      saveCourses(courses);

      alert('Quiz and Schedule uploaded successfully!');
      showCourseDetailView();
    });

    function showSectionsTab() {
      document.getElementById('sectionsTab').style.display = 'block';
      document.getElementById('leaderboardTab').style.display = 'none';
      renderSections();
    }

    function showLeaderboard() {
      document.getElementById('sectionsTab').style.display = 'none';
      document.getElementById('leaderboardTab').style.display = 'block';

      const results = JSON.parse(localStorage.getItem('lms_quiz_results')) || [];
      results.sort((a,b) => b.score - a.score);

      const body = document.getElementById('leaderboardBody');
      body.innerHTML = '';

      if (results.length === 0) {
        body.innerHTML = '<tr><td colspan="5" class="text-center">No student submission yet.</td></tr>';
        return;
      }

      results.forEach((r, idx) => {
        body.innerHTML += `
          <tr>
            <td><strong>#${idx + 1}</strong></td>
            <td>${r.studentName}</td>
            <td>${r.sectionName}</td>
            <td>${r.correct} / ${r.total}</td>
            <td><span class="badge bg-success font-size-14">${r.score} Marks</span></td>
          </tr>
        `;
      });
    }

    function showCoursesView() {
      document.getElementById('courseDetailView').style.display = 'none';
      document.getElementById('quizBuilderView').style.display = 'none';
      document.getElementById('coursesView').style.display = 'block';
      renderCourses();
    }

    function showCourseDetailView() {
      document.getElementById('coursesView').style.display = 'none';
      document.getElementById('quizBuilderView').style.display = 'none';
      document.getElementById('courseDetailView').style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('lms_user');
      location.href = 'index.html';
    }

    renderCourses();
</script>
</body>
</html>
